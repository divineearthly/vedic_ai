name: Vedic CI - Fixed

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install numpy pytest
      
      - name: Test existing modules
        run: |
          python -c "import numpy; print('NumPy OK')"
          python -c "import vedic_layers; print('Vedic Layers OK')"
          python -c "import krishi_veda_fix; print('Krishi Fix OK')"
      
      - name: Run simple tests
        run: |
          python test_vedic_working.py
